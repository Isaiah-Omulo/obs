<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Select2 Multiple Select Example</title>
  <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet"/>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
    }
    .select2-container {
      width: 400px !important; /* adjust width */
    }
  </style>
</head>
<body>

  <h2>Select2 Multiple Select Example</h2>

  <form action="http://httpbin.org/post" method="post">
    <label for="bears">Select Bears</label><br>
    <select id="bears" multiple class="select2" name="test[]">
      <option>American Black Bear</option>
      <option>Asiatic Black Bear</option>
      <option>Brown Bear</option>
      <option>Giant Panda</option>
      <option>Sloth Bear</option>
      <option>Sun Bear</option>
      <option>Polar Bear</option>
      <option>Spectacled Bear</option>
    </select>
    <br><br>
    <input type="submit" value="Submit">
  </form>

  <!-- jQuery + Select2 JS -->
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

  <script>
    $(document).ready(function() {
      $(".select2").select2({
        placeholder: "Begin typing a name to filter...",
        width: "400px"
      });
    });
  </script>

</body>
</html>
